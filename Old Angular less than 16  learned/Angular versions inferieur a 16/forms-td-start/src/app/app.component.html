<div class="container">
  <div class="row">
    <div class="col-xs-12 col-sm-10 col-md-8 col-sm-offset-1 col-md-offset-2">
      <!-- Add a Form with the following Inputs (and Validators)
           1) Mail address (should not be empty and should be an email address)
           2) A Dropdown which allows the user to select from three different Subscriptions ("Basic", "Advanced", "Pro")
              Set "Advanced" as Default
           3) A Password field (should not be empty)
           4) A Submit Button

           Display a warning message if the Form is invalid AND was touched. Display a warning message below each input if it's invalid.

           Upon submitting the form, you should simply print the Value of the Form to the Console.
           Optionally, display it in your template.
      -->
      <form #form="ngForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Mail address</label>
          <input
            type="email"
            name="email"
            id="email"
            class="form-control"
            required
            email
            ngModel
            #email="ngModel"
          />
          <span class="help-block" *ngIf="!email.valid && email.touched">Enter a valid email!</span>
        </div>
        <div class="form-group">
          <label for="subscription">Subscription</label>
          <select name="subscription" id="subscription" [ngModel] ="selectedSubscription" class="form-control">
            <option *ngFor="let itemSubscription of subscriptionList" [value]="itemSubscription">{{itemSubscription}}</option>
          </select>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            name="password"
            id="password"
            class="form-control"
            required
            minlength="6"
            ngModel
            #password="ngModel"
          />
           <span class="help-block" *ngIf="!password.valid && password.touched">Enter a valid password (6 character least)!</span>
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="!form.valid">Submit</button>
      </form>
    <p *ngIf="!form.valid && form.touched">The Form is invalid!</p>
    </div>
  </div>
  <div class="row" *ngIf="submited">
    <div class="col-xs-12">
      <p>Your Data:</p>
      <p>Mail address: {{data.email}}</p>
      <p>Subsciption Type: {{data.subscription}}</p>
      <p>Password: {{data.password}}</p>
    </div>
  </div>
</div>
